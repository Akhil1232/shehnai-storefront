# /etc/nginx/sites-available/shehnai
# Replace test.theshehnai.com throughout, then:
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d test.theshehnai.com -d www.test.theshehnai.com
# Certbot rewrites this file to add the TLS block and a :80 -> :443 redirect.

# Razorpay webhooks and checkout bursts: modest rate limits that protect the
# Node process without getting in a real customer's way.
limit_req_zone $binary_remote_addr zone=shehnai_api:10m rate=10r/s;

upstream shehnai_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name test.theshehnai.com;

    # Jewellery photos are large; allow generous uploads from the admin panel.
    client_max_body_size 25M;

    # Compression. Images are already compressed, so text only.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # STAGING ONLY. Remove both of these when this block becomes production,
    # or the live store will be invisible to search engines.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Next.js build output is content-hashed, so it can be cached forever.
    location /_next/static/ {
        proxy_pass http://shehnai_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_next/image {
        proxy_pass http://shehnai_app;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Belt and braces alongside the header above — served by nginx so it works
    # even if the app is down. STAGING ONLY.
    location = /robots.txt {
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # The admin panel is not for the public internet's crawlers.
    location /admin {
        proxy_pass http://shehnai_app;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /api/ {
        limit_req zone=shehnai_api burst=20 nodelay;
        proxy_pass http://shehnai_app;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        # Razorpay signature verification reads the RAW body — never let a
        # proxy rewrite or buffer-modify it.
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://shehnai_app;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
